# Reservation rules per product category.
#
# <CATEGORY>.hold-time            Time the customer has to pay (ISO-8601 duration: PT15M, PT24H, ...). Required.
# <CATEGORY>.max-units-per-order  Max units per order (positive integer). Omit it for "no limit".
#
# Every value of the ProductCategory enum must have a hold-time, otherwise the service fails at startup.

STANDARD.hold-time=PT15M

PRE_ORDER.hold-time=PT24H

FLASH_SALE.hold-time=PT5M
FLASH_SALE.max-units-per-order=2
